services:
  # Express Backend Web Service
  - type: web
    name: book-a-doctor-backend
    env: node
    region: singapore
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false

  # React Frontend Static Site
  - type: static
    name: book-a-doctor-frontend
    buildCommand: cd client && npm install && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://book-a-doctor-backend.onrender.com/api
